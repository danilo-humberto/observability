services:
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    command: ["--config", "/etc/jaeger/config.yaml"]
    volumes:
      - ./observability/jaeger/config.yaml:/etc/jaeger/config.yaml:ro
    ports:
      - "127.0.0.1:${JAEGER_PORT:-16686}:16686"

  postgres:
    image: postgres:18.6-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "compute_query_id=auto", "-c", "pg_stat_statements.track=top"]
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLIENTS_COUNT: ${CLIENTS_COUNT-1000}
      ORDERS_COUNT: ${ORDERS_COUNT-10000}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/sql:/opt/database:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  dados-api:
    build: ./services/dados-api
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      OTEL_SERVICE_NAME: dados-api
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER-parentbased_always_on}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: observability
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
      PGPOOL_MAX: ${PGPOOL_MAX-10}
      PGCONNECT_TIMEOUT_MS: ${PGCONNECT_TIMEOUT_MS-1000}
      PGSTATEMENT_TIMEOUT_MS: ${PGSTATEMENT_TIMEOUT_MS-1000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/ready',{signal:AbortSignal.timeout(3000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    stop_grace_period: 7s

  pedidos-api:
    build: ./services/pedidos-api
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      OTEL_SERVICE_NAME: pedidos-api
      OTEL_BSP_SCHEDULE_DELAY: "1000"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER-parentbased_always_on}
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      DADOS_API_URL: http://dados-api:3001
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS-3000}
    ports:
      - "127.0.0.1:${PEDIDOS_PORT:-3000}:3000"
    depends_on:
      dados-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    stop_grace_period: 7s

  metrics-init:
    image: postgres:18.6-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: observability
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
      PGCONNECT_TIMEOUT: "3"
    entrypoint: ["psql"]
    command: ["-X", "-v", "ON_ERROR_STOP=1", "--file=/opt/metrics/enable.sql"]
    volumes:
      - ./observability/postgres-exporter/enable.sql:/opt/metrics/enable.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres:5432/observability?sslmode=disable&connect_timeout=1
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    command: ["--collector.stat_statements", "--no-collector.stat_statements.include_query", "--collection-timeout=2s"]
    depends_on:
      metrics-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/tmp/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=256MB
    # A imagem declara VOLUME /prometheus. Substituí-lo evita um volume
    # anônimo sem uso; o histórico fica na camada do contêiner em /tmp.
    tmpfs:
      - /prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_DATA: /tmp/grafana
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 4s
      retries: 24
      start_period: 30s

volumes:
  postgres_data:
